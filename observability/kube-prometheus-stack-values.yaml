# helm install kps prometheus-community/kube-prometheus-stack -n observability -f ce-fichier
fullnameOverride: kps
prometheus:
  prometheusSpec:
    scrapeInterval: 15s
    evaluationInterval: 15s
    # Prendre en compte nos PrometheusRule / ServiceMonitor sans label spécifique
    ruleSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    # Scrape automatique des pods annotés prometheus.io/scrape: "true"
    additionalScrapeConfigs:
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            target_label: app

grafana:
  adminPassword: admin
  service:
    type: NodePort
    nodePort: 30030
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      searchNamespace: ALL
  additionalDataSources:
    - name: Loki
      uid: loki
      type: loki
      url: http://loki.observability.svc.cluster.local:3100
      jsonData:
        # Logs -> Traces : le trace_id (metadata structurée OTLP) devient un lien vers Tempo
        derivedFields:
          - name: trace_id
            matcherType: label
            matcherRegex: trace_id
            datasourceUid: tempo
            url: "$${__value.raw}"
            urlDisplayLabel: "Voir la trace"
    - name: Tempo
      uid: tempo
      type: tempo
      url: http://tempo.observability.svc.cluster.local:3200
      jsonData:
        # Traces -> Logs : depuis une trace, ouvrir les logs qui ont le même trace_id
        tracesToLogsV2:
          datasourceUid: loki
          spanStartTimeShift: "-5m"
          spanEndTimeShift: "5m"
          customQuery: true
          query: '{service_name="catalog-api"} | trace_id="$${__trace.traceId}"'
        serviceMap:
          datasourceUid: prometheus
        nodeGraph:
          enabled: true

alertmanager:
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: "null"
      group_by: [alertname, severity]
      group_wait: 30s
      repeat_interval: 1h
      routes:
        - matchers: ['severity="critical"']
          receiver: pager
        - matchers: ['severity="warning"']
          receiver: slack
    receivers:
      - name: "null"
      # "Page" : simulé par un webhook (ex. https://webhook.site/<votre-id>)
      - name: pager
        webhook_configs:
          - url: https://webhook.site/fed1570f-7f7e-442e-8031-0bddfd226afc
            send_resolved: true
      - name: slack
        slack_configs:
          - api_url: https://webhook.site/fed1570f-7f7e-442e-8031-0bddfd226afc
            channel: "#alerts"
            send_resolved: true
            title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
            text: '{{ range .Alerts }}{{ .Annotations.summary }}{{ "\n" }}{{ end }}'
