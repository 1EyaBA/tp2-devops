apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8srequiredresources
spec:
  crd:
    spec:
      names:
        kind: K8sRequiredResources
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8srequiredresources

        containers[c] { c := input.review.object.spec.containers[_] }
        containers[c] { c := input.review.object.spec.initContainers[_] }
        containers[c] { c := input.review.object.spec.template.spec.containers[_] }
        containers[c] { c := input.review.object.spec.template.spec.initContainers[_] }

        # Pour chaque conteneur : requests.cpu, requests.memory, limits.cpu, limits.memory
        violation[{"msg": msg}] {
          c := containers[_]
          section := ["requests", "limits"][_]
          resource := ["cpu", "memory"][_]
          not c.resources[section][resource]
          msg := sprintf("Conteneur <%v> : resources.%v.%v est obligatoire", [c.name, section, resource])
        }
