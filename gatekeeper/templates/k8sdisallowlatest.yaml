apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8sdisallowlatest
spec:
  crd:
    spec:
      names:
        kind: K8sDisallowLatest
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8sdisallowlatest

        # Récupère les conteneurs d'un Pod ou d'un objet avec template (Deployment, Job...)
        containers[c] { c := input.review.object.spec.containers[_] }
        containers[c] { c := input.review.object.spec.initContainers[_] }
        containers[c] { c := input.review.object.spec.template.spec.containers[_] }
        containers[c] { c := input.review.object.spec.template.spec.initContainers[_] }

        # Cas 1 : tag explicite ":latest"
        violation[{"msg": msg}] {
          c := containers[_]
          endswith(c.image, ":latest")
          msg := sprintf("Conteneur <%v> : le tag 'latest' est interdit (image %v)", [c.name, c.image])
        }

        # Cas 2 : pas de tag du tout (Docker utilise alors 'latest' implicitement)
        violation[{"msg": msg}] {
          c := containers[_]
          not has_tag(c.image)
          msg := sprintf("Conteneur <%v> : l'image %v n'a pas de tag explicite (=latest)", [c.name, c.image])
        }

        has_tag(image) { contains(image, "@") }
        has_tag(image) {
          parts := split(image, "/")
          contains(parts[count(parts) - 1], ":")
        }
